name: CI

# Validation only — no deploys, no App Store / Play Store steps. See M1 in
# docs/ARCHITECTURE_DECISION_RECORDS.md.
on:
  pull_request:
  push:
    branches:
      - main
      - platform/mobile-app

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          # This is the project's application/runtime Node version used to
          # run pnpm/tests/build — unrelated to, and not changed because of,
          # the GitHub Actions Node-20-runtime deprecation warning below
          # (which is about the actions' own internal execution environment,
          # not this value). Bumping checkout/setup-node/action-setup to
          # their current major versions (Node-24-ready per each project's
          # own releases) is what resolves that warning.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm run typecheck

      - name: Lint (all workspaces)
        run: pnpm run lint

      - name: Worker tests
        run: pnpm --filter worker run test

      - name: Frontend build
        run: pnpm --filter frontend run build

      - name: Worker dry-run build
        run: pnpm --filter worker exec wrangler deploy --dry-run

      - name: Mobile tests
        run: pnpm --filter mobile run test

      - name: Mobile Expo config validation
        # Resolves app.config.ts (env-driven — see mobile/app.config.ts and
        # mobile/README.md "Environments") without requiring EAS credentials
        # or a real device/simulator. Deliberately not `expo-doctor` or an
        # actual `expo export`/build — those need network calls to Expo's
        # services or native toolchains this runner doesn't have; this step
        # is the "safe non-credentialed build validation" M3 asked for.
        run: pnpm --filter mobile run config:check
